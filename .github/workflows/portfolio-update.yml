name: Portfolio Data Update

on:
  schedule:
    - cron: "0 17 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest price data and rebuild data.json
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: node fetch-data.js

      - name: Commit updated data.json
        run: |
          git config user.name "portfolio-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Daily data update: $(date -u +'%Y-%m-%d')"
          git push
