name: Update Portfolio Data

# Two scheduled runs a day, both UTC (cron does not know about London's
# clock changes — 17:00 UTC is 18:00 London during BST and 17:00 London
# during GMT; adjust if that drift ever matters to you):
#   1. ~17:00 UTC, weekdays — shortly after LSE close (16:30), to pick up
#      the day's confirmed RR./MTRO./TRAC/JET2 closing prices.
#   2. ~06:30 UTC, every day — after the US close and the main Asia
#      session (Tokyo/Hong Kong) have both wrapped, refreshing headlines
#      ahead of the EMEA open.
# Also runnable manually anytime from the Actions tab.
on:
  schedule:
    - cron: "0 17 * * 1-5"
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest price data and rebuild data.json
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: node fetch-data.js

      - name: Commit updated data.json
        run: |
          git config user.name "portfolio-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Daily data update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
